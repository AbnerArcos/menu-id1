<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef - Menú Digital</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>



  <!-- HEADER -->
  <div class="header"></div>

  <div class="logo-area">
    <h1>Chef</h1>
  </div>
<div class="menu-index">
  <a href="#antojitos">Antojitos</a>
</div>


  <!-- CATEGORIA -->
  <div class="section" id="antojitos">
  <h2>Antojitos</h2>

 <h3 class="subtema-simple">Empanadas</h3>


    <div class="grid">

      <!-- CARD 1 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1604908554027-5e63c0a2e9b4" alt="">
        <h3>Empanada de pastor</h3>
        <p>Elige la cantidad</p>
        <div class="price">$25</div>
        <button class="add-btn" data-name="Empanada de pastor" data-price="25">
		Agregar
		</button>

      </div>

      <!-- CARD 2 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1603079847828-13b94e5a2f4f" alt="">
        <h3>Empanada de molida</h3>
        <p>Elige la cantidad</p>
        <div class="price">$25</div>
        <button class="add-btn" data-name="Empanada de molida" data-price="25">
		Agregar
		</button>

      </div>

      <!-- CARD 3 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1625943555417-56dba3b3ed7a" alt="">
        <h3>Empanada hawaiana</h3>
        <p>Elige la cantidad</p>
        <div class="price">$30</div>
        <button class="add-btn" data-name="Empanada hawaiana" data-price="30">
		Agregar
		</button>
      </div>

    </div>
</div>

  <!-- CARRITO -->
  <div class="cart">
    <span id="cart-count">0 productos</span>
    <span id="cart-total">$0</span>
  </div>
  
  <!-- CARRITO FLOTANTE -->
<div class="floating-cart" id="floatingCart">
  🛒
  <div class="cart-badge" id="cartBadge">0</div>
</div>

<!-- MODAL CARRITO -->
<div class="cart-modal" id="cartModal">
  <div class="cart-content">
  <button id="closeCartBtn" class="close-top">✕</button>
  <h2>Tu pedido</h2>

    <div id="cartItems"></div>
    <div class="cart-footer">
  <strong>Total: $<span id="modalTotal">0</span></strong>
  <div>
    <button id="sendWhatsapp" class="whatsapp-btn">
	Enviar pedido por WhatsApp
	</button>

  </div>
</div>

  </div>
</div>

<!-- MODAL PRODUCTO -->
<div class="product-modal" id="productModal">
  <div class="product-content">
  <h3 id="productName"></h3>

  <div class="quantity-box">
    <button id="minusBtn">-</button>
    <span id="quantity">1</span>
    <button id="plusBtn">+</button>
  </div>

  <textarea 
    id="productComment" 
    placeholder="Agregar comentario (ej: sin cebolla)">
  </textarea>

  <div class="modal-buttons">
    <button id="cancelAdd">Cancelar</button>
    <button id="confirmAdd">Agregar</button>
  </div>
</div>

</div>

<!-- MODAL CONFIRMAR ENVÍO -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-content">
    <h3>Confirmar pedido</h3>

    <div id="confirmOrderList"></div>

    <div class="confirm-total">
      Total: $<span id="confirmTotal">0</span>
    </div>

    <div class="confirm-buttons">
      <button id="cancelSend">Cancelar</button>
      <button id="confirmSend">Enviar a WhatsApp</button>
    </div>
  </div>
</div>


  <script src="script.js"></script>
</body>
</html>
